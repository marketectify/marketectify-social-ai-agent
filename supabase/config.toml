# Used by the Supabase CLI when deploying functions (see .github/workflows/deploy-functions.yml).

project_id = "marketectify-social-ai-agent"

# The function checks the user's login itself (auth.getUser), which works with every
# Supabase key type. The gateway-level JWT check is therefore switched off.
[functions.generate-content]
verify_jwt = false

# youtube-auth and youtube-refresh check the login themselves (like generate-content).
[functions.youtube-auth]
verify_jwt = false

[functions.youtube-refresh]
verify_jwt = false

# Google sends the browser here without a login header. The signed "state" value proves it is genuine.
[functions.youtube-callback]
verify_jwt = false

[functions.help-assistant]
verify_jwt = false

[functions.generate-image]
verify_jwt = false

# Facebook + Instagram. meta-auth and meta-api check the login themselves (auth.getUser).
[functions.meta-auth]
verify_jwt = false

[functions.meta-api]
verify_jwt = false

# Meta sends the browser here without a login header; the signed "state" value proves it is genuine.
[functions.meta-callback]
verify_jwt = false

# Called by the scheduler with the x-cron-secret header.
[functions.meta-cron]
verify_jwt = false

# LinkedIn. linkedin-auth checks the login itself; linkedin-callback is opened by LinkedIn.
[functions.linkedin-auth]
verify_jwt = false

[functions.linkedin-callback]
verify_jwt = false

# Google Business Profile. gbp-auth checks the login itself; gbp-callback is opened by Google.
[functions.gbp-auth]
verify_jwt = false

[functions.gbp-callback]
verify_jwt = false
