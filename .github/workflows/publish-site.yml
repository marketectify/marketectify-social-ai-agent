name: Publish site to deploy branch

# Every push to main builds the app and publishes ONLY the finished website
# files (index.html, assets/, .htaccess) to the `deploy` branch.
# Point Hostinger's Git deployment at the `deploy` branch (root: public_html).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check Supabase keys are available
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error title=$name is empty::GitHub did not pass $name to this build. Add it under Settings > Secrets and variables > Actions > Repository secrets (not Variables, not Environments), with exactly this name."
              missing=1
            else
              echo "$name is set (${#value} characters)"
            fi
          done
          if [ "${missing:-0}" = "1" ]; then
            echo "::warning::Building in DEMO mode because the keys above are missing."
          fi
          case "$VITE_SUPABASE_URL" in
            ""|https://*.supabase.co) ;;
            *) echo "::error title=VITE_SUPABASE_URL looks wrong::It must look like https://abcdxyz.supabase.co (no /rest/v1, no spaces)."; exit 1 ;;
          esac

      - name: Install and build
        env:
          # Public values (safe in the browser). Without them the site runs in demo mode.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Optional: email or https address behind the "Upgrade" button.
          VITE_UPGRADE_CONTACT: ${{ secrets.VITE_UPGRADE_CONTACT }}
        run: |
          npm ci
          npm run build

      - name: Publish built files to deploy branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/site && mkdir /tmp/site
          cp -r dist/. /tmp/site/
          cp .htaccess /tmp/site/.htaccess
          cd /tmp/site
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: site from main @ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy

      # Optional: upload the built site straight to Hostinger by FTP. This works even when
      # Hostinger's GitHub connection is broken. It is skipped unless the three FTP secrets exist.
      - name: Check FTP secrets
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "FTP secrets not set: skipping FTP upload (the deploy branch is still updated)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload site to Hostinger by FTP
        if: steps.ftp.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: /tmp/site/
          # Upload into the folder of the site (set the FTP_DIR secret, for example /domains/social-ai.marketectify.com/public_html/).
          server-dir: ${{ secrets.FTP_DIR || './' }}
